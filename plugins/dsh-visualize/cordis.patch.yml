# dsh-visualize —— 对话内可视化插件 loader 配置。
#
# id  : 插件在宿主里的稳定标识，与 npm 包名保持一致（@bluechonk/dsh-visualize）。
#       改它会丢用户配置，勿动；卸载时用这个 id 在插件管理器里定位。
# name: npm 包名（scope 版），宿主按此名在 profile 的 node_modules 里解析插件包。
#
# host 半(lib/index.js)：挂同源路由，把工作区里的 HTML 文件按白名单校验后发给前端 iframe。
# client 半(client/client.js)：遮蔽 assistant-step 聊天节点——没有 viz 围栏时原样交给官方
#   渲染器（行为与原生一致），有 viz 围栏时剥掉围栏、把页面以沙箱 iframe 追加渲染。
#
# 回滚：plugin remove（或本 patch enabled:false）；插件自身不写任何持久化数据。
- insert:
    - id: '@bluechonk/dsh-visualize'
      name: '@bluechonk/dsh-visualize'
      config: {}
