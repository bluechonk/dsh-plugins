name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x ]
    steps:
      # 索引校验要读取钉住的祖先提交（merge-base / git show），
      # 浅克隆只看到 HEAD，会误判成「提交不存在」
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 插件都是零运行时依赖，无需 npm install
      - name: 语法检查
        run: npm run check
      - name: 单元测试
        run: npm test
      # 索引必须指向存在的祖先提交，且版本/描述与当前 package.json 一致
      - name: 索引有效性
        run: npm run index:check
