name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x ]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 插件都是零运行时依赖，无需 npm install
      - name: 语法检查
        run: npm run check
      - name: 单元测试
        run: npm test
      # 索引必须与 plugins/ 一致，否则发出去的索引指向旧 commit
      - name: 索引一致性
        run: npm run index:check
